<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Scanner Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-indigo-400 tracking-tight">🛡️ VULNERABILITY SCANNER</h1>
            <p class="text-slate-400 mt-2">Automated Port Scanner & HTTP Header Analyzer Portfolio</p>
        </header>

        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 mb-8">
            <label for="targetSelect" class="block text-sm font-semibold text-slate-300 mb-2">Select Target Laboratory:</label>
            <div class="flex flex-col sm:flex-row gap-4">
                <select id="targetSelect" class="flex-1 bg-slate-950 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="scanme.nmap.org">scanme.nmap.org (Nmap Test Lab)</option>
                    <option value="github.com">github.com (Secure Production Lab)</option>
                    <option value="auto-scan-chi.vercel.app">auto-scan-chi.vercel.app (This Website/Vercel)</option>
                    <option value="sayuran.vip">sayuran.vip (Other Lab)</option>
                </select>
                <button id="scanBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-lg transition duration-200 shadow-md cursor-pointer">
                    Start Security Scan
                </button>
            </div>
        </div>

        <div id="loadingState" class="hidden text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mx-auto mb-4"></div>
            <p class="text-indigo-400 font-medium animate-pulse">Scanning target host... please wait a few seconds.</p>
        </div>

        <div id="resultsState" class="hidden space-y-6 animate-fade-in">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">🌐 Network Ports Status</h3>
                <div id="portGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-bold text-slate-200 mb-4">🔒 HTTP Security Headers</h3>
                <div id="headerList" class="space-y-3">
                    </div>
            </div>

            <div class="text-center pt-4">
                <a id="downloadBtn" href="#" target="_blank" class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-xl transition duration-200 shadow-lg">
                    📥 Download Audit Report (PDF)
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
